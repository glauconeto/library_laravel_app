name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Feature suite (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bob
          POSTGRES_PASSWORD: bob_1234
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bob -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, openssl, tokenizer, xml, ctype, curl, gd, intl
          tools: composer:v2

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      # An empty .env keeps phpdotenv from emitting a "Failed to open stream" warning per test.
      - name: Prepare the environment file
        run: touch .env

      - name: Create the testing database
        run: php -r "new PDO('pgsql:host=127.0.0.1;port=5432;dbname=library', 'bob', 'bob_1234')->exec('CREATE DATABASE testing');"

      - name: Run the test suite
        env:
          APP_KEY: base64:Y2ljaWNpY2ljaWNpY2ljaWNpY2ljaWNpY2ljaWNpY2k=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: bob
          DB_PASSWORD: bob_1234
        run: php artisan test

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type-check (strict)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify the manifest exists
        run: test -f public/build/manifest.json && echo "manifest OK"
